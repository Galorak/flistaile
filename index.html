<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flistaile — O Guardião dos Dois Escudos</title>
  <meta name="description" content="Flistaile é um jogo incremental: um herói com dois escudos enfrenta criaturas, coleta ouro e fica cada vez mais forte.">
  <meta name="theme-color" content="#14111f">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/icon.svg" alt="" width="30" height="30">
      <span>Flistaile</span>
    </div>
    <div class="resources">
      <div class="res res-gold" title="Ouro"><span class="coin"></span><b id="gold">0</b></div>
      <div class="res" title="Dano por segundo dos escudos espectrais"><small>DPS</small><b id="dps">0</b></div>
      <div class="res" title="Dano de cada golpe de escudo (clique)"><small>Golpe</small><b id="clickdmg">1</b></div>
      <div class="res res-souls" title="Égides: cada uma dá +10% de dano"><small>Égides</small><b id="souls">0</b></div>
    </div>
  </header>

  <main class="layout">
    <section class="arena-col">
      <div class="zone-bar">
        <button class="zbtn" id="zprev" aria-label="Zona anterior">&#9664;</button>
        <div class="zone-list" id="zoneList"></div>
        <button class="zbtn" id="znext" aria-label="Próxima zona">&#9654;</button>
        <label class="toggle" title="Avançar automaticamente para a próxima zona">
          <input type="checkbox" id="autoAdv" autocomplete="off">
          <span class="track"><span class="thumb"></span></span>
          <span class="tlabel">Avançar</span>
        </label>
      </div>

      <div class="arena" id="arena">
        <canvas id="cv" aria-label="Arena de batalha"></canvas>
        <div class="zone-info">
          <div><b id="zoneTitle">Zona 1</b> <span id="biomeName"></span></div>
          <div id="zoneProgress"></div>
        </div>
        <div class="monster-hud">
          <div class="mname" id="mName"></div>
          <div class="hpbar"><div class="hpfill" id="mHpFill"></div><span id="mHpText"></span></div>
          <div class="bosstimer" id="bossTimer" hidden><div class="btfill" id="btFill"></div><span id="btText"></span></div>
        </div>
        <div class="hint" id="hint">Clique na arena para golpear com o escudo!</div>
      </div>

      <div class="skills" id="skills"></div>
    </section>

    <aside class="shop">
      <nav class="tabs" id="tabs">
        <button data-tab="treinos" class="active">Treinos<i class="dot"></i></button>
        <button data-tab="atributos">Atributos<i class="dot"></i></button>
        <button data-tab="escudos">Escudos<i class="dot"></i></button>
        <button data-tab="reliquias">Relíquias<i class="dot"></i></button>
        <button data-tab="stats">Estatísticas</button>
        <button data-tab="opcoes">Opções</button>
      </nav>
      <div class="buy-mode" id="buyMode">
        <span>Comprar:</span>
        <button data-mode="1">×1</button>
        <button data-mode="10">×10</button>
        <button data-mode="25">×25</button>
        <button data-mode="max">Máx</button>
      </div>
      <div class="panels">
        <div class="panel active" id="panel-treinos"></div>
        <div class="panel" id="panel-atributos"></div>
        <div class="panel" id="panel-escudos"></div>
        <div class="panel" id="panel-reliquias"></div>
        <div class="panel" id="panel-stats"></div>
        <div class="panel" id="panel-opcoes"></div>
      </div>
    </aside>
  </main>

  <div class="toasts" id="toasts"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script src="assets/game.js?v=1"></script>
</body>
</html>
